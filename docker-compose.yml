services:
  mysql:
    image: mysql:8.4
    container_name: meu-mysql
    environment:
      MYSQL_DATABASE: minha_aplicacao
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp_password"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./web-client
    container_name: web-client
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: